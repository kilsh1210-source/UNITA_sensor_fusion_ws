# full_bringup.launch.py 에서 쓰는 파라미터 모음.
#
# - rplidar_node / image_publisher_node / yolov8_node / image_fusion_node 값은
#   fusion_bringup.launch.py(별도 패키지)로 전달되는 launch 인자의 "기본값"으로만 쓰인다.
#   (그 launch 파일을 단독 실행할 때는 이 파일과 무관하게 자체 기본값이 적용됨)
# - l_shape_node는 여기서 직접 실행하므로 전체 파라미터가 그대로 로드된다.
#
# 값을 바꾸려면 이 파일만 고치면 되고, launch 인자로 여전히 임시 override도 가능
# (예: ros2 launch sensor_fusion_bringup full_bringup.launch.py fov_deg:=120.0)

rplidar_node:
  ros__parameters:
    # /dev/ttyUSB0 같은 번호는 재연결/재부팅마다 바뀐다(실제로 ttyUSB0 -> ttyUSB1로 바뀌면서
    # rplidar_node가 사라진 포트를 붙잡은 채 좀비가 된 적 있음: 프로세스는 살아있는데 /scan은 안 나옴).
    # 아래 by-id 경로는 라이다 USB-시리얼 칩(CP2102N)의 시리얼 번호 기반이라
    # 어느 포트에 꽂든, 재부팅해도 그대로다.
    # 목록 확인: ls -l /dev/serial/by-id/
    serial_port: /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_7a472fe3536eef11b42ae5c2c169b110-if00-port0
    serial_baudrate: 460800
    frame_id: laser

image_publisher_node:
  ros__parameters:
    cam_num: 0
    # C920 두 대가 꽂혀 있고 모델명이 같아서 by-id로는 구분이 안 된다
    # (두 번째 카메라는 by-id 링크가 아예 안 생김 - 이름 충돌).
    # 그래서 "꽂은 USB 포트" 기준인 by-path로 전방(YOLO용) 카메라를 고정한다.
    # 번호(cam_num)는 재부팅마다 바뀔 수 있으므로 이 값이 있으면 그쪽이 우선.
    # 목록 확인: ros2 run camera_perception_pkg list_cameras --probe
    # 만약 화면에 다른 카메라가 나오면 아래 2.2.4.3 을 2.2.3 으로 바꾸면 된다.
    camera_device: /dev/v4l/by-path/platform-3610000.usb-usb-0:2.2.4.3:1.0-video-index0
    # 캘리브레이션(fx/fy/cx/cy)을 뽑은 해상도와 반드시 같아야 함
    frame_width: 640
    frame_height: 480
    # 오토포커스/자동노출 고정.
    # 켜 두면 가만히 있는 동안 초점이 먼 배경으로 옮겨가서, 가까운 콘은 흐려져 놓치고
    # 먼 배경에서 오탐이 난다(손으로 렌즈를 가렸다 떼면 재수렴해서 잠깐 잘 잡히는 이유).
    autofocus: false
    focus: -1              # 0~255 절대 초점값. -1이면 안 건드림.
                           # 콘이 잘 보이는 거리에 맞춰 잡을 것 (아래 README의 튜닝 절차 참고)
    auto_exposure: false
    exposure: -1           # -1이면 안 건드림. 실내에서 화면이 너무 어두우면 값을 올릴 것
    auto_white_balance: false
    white_balance: -1
    use_mjpg: true

yolov8_node:
  ros__parameters:
    device: cuda:0
    threshold: 0.5
    iou: 0.45
    # --- 오탐 억제 ---
    # 멀리 있는 배경에서 작은 박스로 튀는 오탐 제거용. 0이면 해당 필터 끔.
    # 640x480 기준: 24x24 px보다 작은 검출은 주행에 쓸 만큼 가깝지 않다고 보고 버림.
    min_box_area_px: 576
    min_box_height_px: 20
    # bbox 아래변이 화면 위쪽 30% 안에서 끝나면 버림 (지평선 위 = 하늘/먼 배경)
    min_box_bottom_ratio: 0.30
    # 클래스별 임계값 override 예시: "cone:0.60,drum:0.55"
    class_thresholds: ""
    log_filtered: true

image_fusion_node:
  ros__parameters:
    # 카메라 내부파라미터(캘리브레이션 값). 4개 다 여기서 관리한다
    # (예전에는 fx/cx만 launch로 넘어가고 fy/cy는 소스 기본값이 조용히 쓰였음)
    fx: 565.529459
    fy: 566.767111
    cx: 337.983746
    cy: 290.095566
    # 라이다 정면 방향 보정(도). l_shape_node의 front_angle_deg에도 동일 적용.
    front_angle_deg: -180.0
    display_mode: boxes       # raw / lidar / boxes / bev (창에서 숫자키 1~4로 실행 중 전환 가능)
    distance_tolerance: 0.6
    draw_all_points: true
    use_urdf_extrinsic: true
    lidar_frame_id: laser
    camera_frame_id: camera_optical_frame_tilted  # camera_link_tilted(camera_pitch_deg 다운틸트)를 광학 좌표계(X우/Y하/Z앞)로 변환한 프레임 (unita_minicar_description/launch/description.launch.py)

    # --- 라이다 투영 미세보정 ---
    # URDF의 다운틸트(camera_pitch_deg=14도)는 손으로 잰 값이라 1~2도 오차가 흔하고,
    # 화면상 1도 ≈ 10 px라서 그게 곧 "점이 살짝 틀어져 보임"으로 나타난다.
    # 실행 중 Fusion Visualizer 창에서 i/k(pitch), j/l(yaw), u/o(roll), n/m(height)로
    # 맞춘 뒤 p키를 누르면 아래에 붙여넣을 값이 로그로 출력된다.
    calib_pitch_deg: 12.25      # + 면 점이 화면 위로
    calib_yaw_deg: 0.25        # + 면 점이 화면 오른쪽으로
    calib_roll_deg: 0.0
    calib_height_m: 0.0       # + 면 카메라가 실제로 더 높이 달려있다는 뜻
    calib_step_deg: 0.25
    calib_step_m: 0.01
    # 화면에 pitch/yaw/roll/height 보정값 + 단축키 안내를 오버레이로 표시할지 여부.
    # 라이다-카메라 정렬 캘리브레이션(README 6번) 할 때만 필요. 평소 주행/디버깅 중엔
    # 화면 가리고 헷갈리기만 해서 끔. 정렬 다시 맞출 땐 true로.
    show_calib_hud: false

    # 빈 탐지가 연속 이 횟수 오면 박스를 즉시 지움.
    # 예전에는 빈 프레임을 통째로 무시해서 오탐 박스 하나가 1.5초씩 화면에 남았다.
    det_clear_after_empty: 3

    # TF를 못 쓸 때만 쓰는 폴백 (URDF 실측값과 일치시켜 둠)
    cam_x_offset: 0.730       # 카메라에서 본 라이다 원점까지의 앞쪽 거리 [m]
    cam_height: 0.550         # 카메라에서 본 라이다 원점까지의 아래쪽 거리 [m]
    cam_pitch_deg: 14.0       # 카메라 다운틸트 [도]

    # 판단(decision_making) 쪽으로 넘길 장애물 정보.
    # Point32(x=가장 가까운 장애물 거리[m], y=이미지상 중심 x[px], z=감지 플래그)
    publish_obstacle_info: true
    obstacle_topic: /lidar_obstacle_info
    # 검출된 장애물 전부. 각 점 = (x=거리[m], y=이미지상 중심x[px], z=박스 반폭[px]).
    # 가장 가까운 하나만 보내면, 그걸 피해 지나가 박스가 사라지는 순간 판단에서 빠져
    # 다음 장애물만 보고 꺾다가 직전 장애물을 들이받는다.
    obstacle_array_topic: /lidar_obstacle_array
    # 차선 마스크는 박스가 화면을 가득 채워서 "코앞에 장애물" 오판을 만든다. 장애물/표시 대상에서 제외
    obstacle_class_exclude: "lane_1,lane_2"
    box_class_exclude: "lane_1,lane_2"

l_shape_node:
  ros__parameters:
    scan_topic: /scan
    marker_topic: /l_shape_boxes
    frame_id: laser

    cluster_tolerance: 0.12    # [m] 인접 포인트 연결 기준
    min_cluster_size: 6
    max_cluster_size: 400
    max_range: 6.0             # [m]

    front_angle_deg: -180.0
    fov_deg: 150.0             # front_angle_deg 중심으로 남길 시야각(도)

    theta_resolution_deg: 1.0
    min_points_for_fit: 4

    rect_line_width: 0.02
    show_heading_arrow: true
    arrow_length: 0.3
    show_text: true
    text_size: 0.15

# =============================================================
# 이하: 자율주행(drive.launch.py) 전용. minicar_sim에서 이식한 인지->판단->제어 체인
#   /detections -> lane_info_extractor -> /yolov8_lane_info
#   -> path_planner(lattice) -> /path_planning_result
#   -> motion_planner(pure pursuit + PD) -> /topic_control_signal
#   -> serial_sender -> 아두이노("C,front_pwm,rear_pwm,u")
# =============================================================

lane_info_extractor_node:
  ros__parameters:
    sub_detection_topic: /detections
    sub_lidar_obstacle_topic: /lidar_obstacle_info
    sub_lidar_obstacle_array_topic: /lidar_obstacle_array
    pub_topic: /yolov8_lane_info
    roi_image_topic: /roi_image
    show_image: true           # ROI 디버그 창(Lane Info). 헤드리스로 돌릴 땐 false

    # 차선 변경 시 옆 차선까지 이동할 BEV 픽셀 거리. minicar_sim은 200, 실차ws에서는 280을 썼음
    # 추종할 차선을 고정한다('lane_1'=좌측선 / 'lane_2'=우측선 / ''=자동 판단).
    # 실측(주행 20초 191프레임): lane_2 단독 91.1%, 둘 다 8.9%, lane_1 단독 0%.
    # 자동 판단을 돌리면 판정이 흔들릴 때마다 타겟이 lane_width_pixel만큼 튄다.
    fixed_lane_class: 'lane_2'

    lane_width_pixel: 280.0
    # 이 거리[m]보다 가까운 장애물만 회피 대상 (minicar_sim은 2.4)
    avoidance_trigger_dist: 1.8
    shift_speed: 20.0          # 프레임당 오프셋 변화량(px). 클수록 차선 변경이 급해짐

    # [신규] 회피 오프셋 "해제" 디바운싱. 장애물이 현재 차선과 확실히 안 겹치는 게
    # 이만큼 연속 프레임 확인돼야 원래 차선으로 복귀한다. 트리거(회피 시작)는 즉시.
    # 미검출(정보 없음) 프레임은 이 카운트에 반영되지 않고 현재 회피 상태를 그대로 유지한다
    # (장애물 근접 시 YOLO 인식이 끊기면서 조기 복귀해 그대로 박는 사고를 막기 위함).
    avoidance_release_threshold_count: 15

    image_center_x: 320
    lane_1_far_left_threshold: 180.0
    lane_2_far_right_threshold: 460.0
    # 차선 상태(1/2차선) 전환 디바운싱. 이만큼 연속으로 잡혀야 전환한다.
    # 1이면 minicar_sim 원본과 동일(즉시 전환). 실차는 마스크가 튀어서 15 정도가 안정적
    lane_change_threshold_count: 15

    # BEV 변환 원본 좌표 4점 (좌상x,좌상y, 우상x,우상y, 우하x,우하y, 좌하x,좌하y) - 640x480 기준.
    # 카메라 장착 각도가 sim과 다르면 여기부터 다시 잡아야 한다 (bev_tuning 참고)
    src_points: [154.0, 298.0, 486.0, 298.0, 614.0, 470.0, 26.0, 470.0]
    # [ROI를 조금 더 멀리(높이) 확장 300 -> 260] target_y_start/end/step(5/95/30)은 그대로 둬서
    # 상대 행(5/35/65)은 안 바꾸고, 그 행들이 가리키는 절대 위치만 더 멀어지게 했다
    # (기존 305/335/365 -> 265/295/325, 약 40px 더 원거리). 곡선을 좀 더 일찍 읽게 하려는
    # 목적. lane_width_for_center(216)는 원래 305~365 구간 실측(±2.3px 오차)으로 맞춘
    # 값이라 265~295 구간에서도 그대로 맞을지는 검증 전이다 — 너무 작게(과소 추정) 나오면
    # 그 행들의 target_x가 안쪽 선 쪽으로 쏠려 보일 것이니, target_points 로그로 확인할 것.
    # 더 멀리 밀고 싶으면(근거리 행 문제와는 반대 방향) 이 값을 계속 낮추면 된다.
    roi_cutting_idx: 260       # BEV에서 아래쪽으로 잘라 남길 픽셀 (차 앞쪽만)
    target_y_start: 5          # 타겟 포인트를 뽑을 ROI 이미지상 y 범위/간격
    # ROI에서 y가 클수록 차량에 가까운 쪽이다. 가까운 행은 차선이 화각/ROI를 벗어나
    # 한쪽 선만 걸리는데, 그러면 lane_width_for_center(300)의 절반을 더해 중심을
    # 추정하다가 크게 튄다. 실측(131프레임): y=5/35/65는 362 대비 ±2.3으로 정확한 반면
    # y=95는 528.7(+167), y=125는 아예 검출 실패(-1)였다.
    # 그 쓰레기값이 경로를 오른쪽으로 당겨 PD 항에 +0.52 편향을 만들었다.
    # 근거리 행(95/125)을 되살려 봤지만 먼 행과 70~80px 어긋난다(실측 181프레임:
    # y=5/35/65는 237/246/252인데 y=95/125는 176/166).
    # BEV는 원근 보정이라 행마다 스케일이 달라 실제 차선 폭이 근거리 ~125, 원거리 ~222로
    # 변하는데, lane_width_for_center는 모든 행에 같은 값을 쓴다. 그래서 근거리에서
    # 반드시 어긋난다. 행별 폭을 쓰도록 고치기 전에는 먼 행만 쓰는 편이 안전하다.
    target_y_end: 95
    target_y_step: 30
    # BEV ROI에서 가정하는 차선 폭(px). draw_edges()가 추종 클래스 하나만 그리므로
    # get_lane_center는 항상 선 1개만 보고 '중심 = 선위치 ± 폭/2'로 추정한다.
    # 즉 이 값은 일부 구간이 아니라 사실상 모든 프레임에 적용된다.
    #
    # 300은 근거 없는 기본값이었다. 주행 실측(184프레임)에서 target_x 평균이 289.5로
    # car_center_x(332)보다 42.5px 왼쪽에 고정돼, 조향의 85%가 한쪽으로 쏠렸다.
    # 추정을 42px 오른쪽으로 옮기려면 폭을 84 줄이면 된다 -> 300-84 = 216.
    # BEV 스케일로 독립 계산한 값(약 212)과도 일치한다.
    lane_width_for_center: 216

    # 차선 기울기(cos) 보정 강도. 0.0=보정 없음(예전 동작), 1.0=완전 보정.
    #
    # get_lane_center는 '선위치 ± 폭/2'로 중심을 추정하는데, 이 이동을 차선에 수직이
    # 아니라 같은 행(가로)에서 한다. 차선이 수직에서 theta만큼 기울면 같은 행에서의
    # 가로 거리는 (폭/2)/cos(theta)라서, 보정이 없으면 곡선에서 항상 부족하게 밀린다.
    # 그만큼 추정 중심이 '추종 중인 선'(lane_2=우측선) 쪽으로 끌려간다.
    #   theta=30도 -> 17px, 40도 -> 33px, 50도 -> 60px 부족
    #   theta=60도 -> 108px 부족 = 폭의 절반, 즉 타겟이 선 위에 정확히 얹힌다
    # 우회전 구간에서는 우측선이 곧 인코스라 "곡선에서 인코스 선을 밟고 주행"이 됐다.
    # theta는 dominant_gradient()가 이미 구해 넘겨주던 값인데 그동안 안 쓰이고 있었다.
    #
    # [곡선 인코스 대응] 0.0 -> 0.5로 시운전 후, 완전 보정인 1.0으로 재상향.
    # README 12번 7항: "곡선에서 인코스 선을 밟는다"는 증상은 제어 게인이 아니라
    # 이 값이 꺼져 있는 게 먼저 의심 대상이라 명시돼 있다.
    # 보정량이 커서(theta=49도면 타겟이 58px 이동) 다른 변경과 겹치면 원인을 못 가리니
    # 이 값만 바꾸고 시운전해서 확인할 것. 보정 배율은 어떤 경우에도 2.0배로 제한된다.
    lane_center_tilt_comp: 1.0

    # '두 선이 보인다' 분기를 막을지 여부. false = 예전 동작.
    # get_lane_center가 보는 선은 원리상 항상 1개(draw_edges가 추종 클래스 하나만 그림)라
    # 원리만 보면 true가 맞다. 하지만 위 lane_width_for_center(216)가 이 분기가 살아있는
    # 상태에서 주행 184프레임으로 역산된 값이라, true로 바꾸면 타겟이 108px 밀린다.
    # 실제로 그렇게 해봤더니 차가 중심으로 복귀하지 못했다.
    # 켜려면 lane_width_for_center를 반드시 다시 재고 함께 바꿀 것.
    lane_center_force_single_line: false

path_planner_node:
  ros__parameters:
    sub_lane_topic: /yolov8_lane_info
    sub_obstacle_topic: /lidar_obstacle_info
    sub_obstacle_array_topic: /lidar_obstacle_array
    pub_topic: path_planning_result
    # 이미지상 차량 앞 범퍼 중심 픽셀. 경로의 시작점으로 쓰인다.
    # motion_planner_node의 car_center_point와 같은 값이어야 한다 (실측 보정값 332).
    car_center_point: [332, 179]

    candidate_count: 7             # 생성할 후보 경로 개수
    max_lattice_offset: 120.0      # 중심선 기준 좌/우 최대 오프셋(px)
    spline_points: 100             # 최종 경로 보간 점 개수
    obstacle_penalty_gain: 3.0     # 안전거리 침범 시 추가 감점 계수
    lane_center_weight: 10.0       # 차선 중앙 유지 가중치
    obstacle_weight: 20.0          # 장애물 회피 가중치
    smoothness_weight: 10.0        # 급조향 경로 감점
    obstacle_dist_threshold: 2.4   # 이 거리[m]보다 가까울 때만 회피 감점 적용
    # [원인 확인 완료 -> 0.05로 복귀] path_planner_node.select_best_candidate()의
    # lane_penalty 수식을 '차선 중앙(x_points)과의 거리'를 재도록 고쳤다(예전엔 후보 자기
    # 평균과의 편차라 곡선에서 offset=0보다 큰 오프셋이 더 싸게 나와 경로가 펴졌었다).
    # 10.0은 그 버그를 격리해 원인을 확인하려고 지그재그 억제 비용을 극단적으로 올려
    # 오프셋 변경 자체를 막아둔 값이었다. 수식이 고쳐졌으니 지그재그 억제 목적에 맞는
    # 값으로 되돌린다.
    #
    # 주의: lane_center_weight(10.0)는 이 버그가 있던 상태(offset과 거의 무관)에서 정해진
    # 값이라, 수식이 고쳐진 지금은 매 프레임 |offset|에 실제로 비례해서 비용이 붙는다.
    # 장애물 회피(obstacle_weight 20 + obstacle_penalty_gain 3 기반, 최대 감점 약 200)보다
    # lane_penalty가 커지는 오프셋(대략 40px 이상)에서는 회피가 밀릴 수 있다. 단, 실제
    # 1차 회피는 lane_info_extractor_node가 목표점 자체를 lane_width_pixel(280px)만큼
    # 미리 옮겨주는 방식이라 여기 영향을 크게 받지 않는다. 그래도 장애물 회피는 반드시
    # 실측으로 재확인할 것.
    path_change_cost: 0.05         # 직전 선택 오프셋에서 멀어질수록 감점(지그재그 억제)
    obstacle_clearance: 40.0       # 장애물과 최소 이격거리(px)

    enable_lattice_debug: false    # 후보 경로 시각화용 lattice_debug 발행 (시각화 노드는 아직 없음)

motion_planner_node:
  ros__parameters:
    sub_path_topic: path_planning_result
    pub_topic: topic_control_signal
    timer: 0.1                     # 제어 주기[s] (0.1 = 10Hz)

    # 신호등/라이다 정지 로직. 우리 쪽엔 신호등 인식 노드가 없어서 꺼둠
    use_traffic_lidar_stop: false

    # BEV ROI 좌표계에서의 차량 중심선. 영상 정중앙(320)이 아니다.
    # BEV src_points가 x=320 대칭이라 영상 중심은 320으로 매핑되므로, 이 차이는
    # 카메라가 차체 중심선보다 왼쪽에 달렸다는 뜻이다. 320을 쓰면 제어기가 '카메라'를
    # 차선 중앙에 맞추고 차체는 그만큼 치우친 채 달린다.
    #
    # 332는 앞바퀴에서 좌우 차선까지 거리를 자로 재서 맞춘 뒤 실측한 값
    # (165프레임, 두 차선 모두 검출, y=5/35 행 332 / y=65 행 330).
    # 눈대중으로 놓고 잰 값은 362, 312로 ±50px 흔들렸는데 332가 그 중간이다.
    # 재현성은 1회 측정이라 미검증. 주행에서 한쪽으로 정상편차가 남으면 이 값을 옮기거나
    # 제어에 적분 보정을 넣어야 한다.
    car_center_point: [332, 179]
    car_center_x: 332
    vehicle_heading_rad: -1.57079632679

    # Pure Pursuit
    # 작을수록 민감, 클수록 완만.
    # 170은 경로에서 가장 먼 점까지의 거리(차량 y=179, 최원점 y=5 -> 174px)와 거의 같아서,
    # 사실상 그 한 점만 보고 조향했다. S자처럼 앞뒤로 휘는 구간에서 중간 형상을 못 읽고
    # 가로지르는 원인. 중간 점들을 보도록 줄인다.
    # [복구 세팅] 아래 두 값은 코드 수정 전 거동을 그대로 재현하도록 맞춰 둔 것이다.
    # find_lookahead_point()가 항상 최원점(차량에서 174px)을 고르고 있었고, 조향각 공식
    # 분모에는 파라미터(120)를 써서 174/120 = 1.45배 과조향이 나가던 상태였다.
    # 코드를 고친 뒤(가까운 쪽부터 탐색 + 분모=실거리) 120을 그대로 두니
    #   직진 횡오차 보정 1.44배(과보정 -> 위빙), 곡선 조향 0.49배(부족)
    # 가 되어 직진조차 못 하게 됐다. 순수 추종의 횡오차 게인은 1/L에 비례한다.
    #
    # 170 -> 참조점이 다시 최원점 근처(y≈12)가 되고,
    # 0.379 = 0.55 × 120/174 -> 분모가 120에서 174로 바뀐 만큼을 되돌린다.
    # 실측 비교(시뮬레이션): 직진 -3.20 / 곡선 +4.50 (수정 전 -3.02 / +4.82)
    #
    # 여기서부터 한 번에 하나씩 다시 조인다. 순서는 README 12번 참고.
    lookahead_distance: 170.0
    wheelbase: 50.0
    max_steer_angle_rad: 0.379
    max_steer_cmd: 9.0             # serial_sender_node의 max_steer_cmd와 같은 값이어야 함

    # PD 보정
    use_pd: true
    Kp: 0.01
    Kd: 0.045
    max_steer: 4.0                 # PD 보정분의 최대 절대값
    lookahead_y: 155

    # --- 조향 출력 스무딩 ---
    # 조향은 MotionCommand.steering(int32)으로 나가면서 반올림되고, serial_sender가
    # max_steer_cmd(9.0)로 나눠 -1.0~1.0으로 정규화한다. 즉 명령 1칸 = 전체 조향의 1/9이고,
    # 조향 포텐셔미터로는 좌 70/9≈7.8, 우 106/9≈11.8 counts다(펌웨어 440/510/616).
    # 펌웨어의 STEERING_DEADBAND는 6이라 이 한 칸이 항상 데드밴드보다 커서, 명령이
    # 1만 바뀌어도 앞바퀴 모터가 켜졌다 확 밀고 꺼진다. 저속에서는 같은 곡률을 도는 데
    # 제어 틱이 더 많이 들어가므로 그 계단이 하나씩 다 "틱틱"으로 느껴진다.
    # 아래 두 값은 한 번의 큰 변화를 여러 틱에 나눠 보내 그 충격을 줄인다.
    # (근본적으로는 max_steer_cmd를 키워 분해능 자체를 올려야 한다. 그때는 Kp/Kd/
    #  max_steer/steer_speed_gain이 같은 단위라 함께 스케일해야 함)
    # [복구 세팅] 일단 꺼 둔다. 직진이 안정된 걸 확인한 뒤 0.4부터 다시 켤 것.
    # 스무딩 자체는 틱틱거림에 효과가 있었지만(아래 표), 0.2s 지연이 과보정과 겹치면
    # 위빙을 키운다. 반드시 직진 안정화 -> 그 다음 스무딩 순서로.
    steer_smoothing_alpha: 1.0     # EMA 계수. 1.0=스무딩 없음. 10Hz에서 0.4면 시정수 약 0.2s
                                   #   켤 때: 0.4 -> 더 부드럽게 0.25 / 더 민첩하게 0.6
    steer_rate_limit: 0.0          # 제어 틱당 최대 변화량(steer_cmd 단위, 전체 범위는 ±9).
                                   #   0 이하면 제한 없음. 켤 때는 3.0(풀조향 왕복 최소 0.6s)

    # 속도 (아두이노 rear PWM으로 그대로 나감). minicar_sim 기본값은 200/100/250이지만
    # 실차에서는 120/80/150을 썼다. 처음 굴릴 땐 낮게 시작할 것.
    # [저속 튜닝 모드] min/max를 base와 같은 값으로 묶어 조향 감속까지 무력화해서
    # motion_planner가 항상 정확히 이 PWM을 내보내게 한다 (motion_planner_node.py:257의
    # clamp(base - gain*|steer|, min, max) 때문에 base만 바꾸면 min에 걸린다).
    # 실측: PWM 50에서 잘 굴러가고 오히려 빨랐음 -> 30으로 낮춤.
    # 너무 느리거나 stall(삐 소리만 나고 안 굴러감)이면 5씩 올릴 것.
    # 조향 튜닝이 끝나고 정상 주행으로 돌아갈 때는 min/max를 다시 벌릴 것. 예)
    #   base_speed: 40 / min_speed: 30 / max_speed: 55
    # [저속 튜닝 모드 유지, 값만 상향] 30 -> 40 (+33%, 요청한 30% 이상 상향).
    # 저속 튜닝 모드라 셋 다 같은 값으로 유지했다. base만 올리면 위 clamp의 max에 걸려
    # 그대로 min/max 값이 나간다. stall(삐 소리만 나고 안 굴러감)이면 5씩 낮출 것,
    # 너무 느리면 5씩 더 올릴 것.
    base_speed: 40
    min_speed: 40
    max_speed: 40
    steer_speed_gain: 12.0         # 조향이 클수록 감속시키는 계수

serial_sender_node:
  ros__parameters:
    sub_topic: topic_control_signal
    port: /dev/ttyACM0             # 아두이노 포트 (ls /dev/ttyACM* 로 확인)
    baudrate: 115200
    max_steer_cmd: 9.0             # motion_planner_node의 max_steer_cmd와 같아야 함
    steering_pwm_max: 150          # 미사용. 아두이노는 조향을 -1.0~1.0 정규화 값으로 받는다
    # 실측 확인: 조향을 +1/-1로 3회 왕복(pot 584 <-> 437)시키고 앞바퀴를 관측한 결과
    # 명령 순서 + - + - + - 에 대해 왼 오 왼 오 로 움직였다.
    # 즉 양(+) 명령 = 좌회전이다. motion_planner는 양수를 우회전으로 쓰므로 뒤집어야 한다.
    # (이 값을 검증 없이 false로 두고 진행하는 바람에, 제어기가 보정할 때마다
    #  반대로 밀려서 차가 한쪽으로 계속 흘러갔다)
    steer_invert: true             # 조향이 반대로 먹으면 true

    launch_rviz: true
